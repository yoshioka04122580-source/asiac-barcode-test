<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>asiac ラベル読み取り試験</title>
<style>
/* 1列のスマホ画面。上にカメラ、下に記録。片手で親指が届く所に大きいボタン */
:root {
  --bg: #f4f6f3; --panel: #ffffff; --fg: #1d2b22; --muted: #5d6b62; --line: #d8e0da;
  --accent: #1f6b45; --accent-fg: #ffffff; --ok: #1f7a3f; --ng: #b3261e; --warn: #9a6400;
  --font: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121714; --panel: #1b221d; --fg: #e4ece6; --muted: #9aa89f; --line: #2f3a33;
    --accent: #4fb37e; --accent-fg: #0d1a12; --ok: #5cc98a; --ng: #ff8a80; --warn: #e3b25a; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; padding-top: 12px; }
h1 { font-size: 19px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
label.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
select, input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; background: var(--line); color: var(--fg); }
button.main { background: var(--accent); color: var(--accent-fg); font-size: 17px; padding: 14px 16px; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cam { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.guide { position: absolute; left: 10%; right: 10%; top: 30%; height: 40%; border: 3px solid rgba(255,255,255,.85); border-radius: 8px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; transition: border-color .15s; }
.guide.hit { border-color: #4be08a; }
.cam .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #fff; font-size: 13px; text-shadow: 0 1px 2px #000; }
.cam .idle { position: absolute; inset: 0; display: grid; place-items: center; color: #ccc; font-size: 14px; text-align: center; padding: 16px; }
.result { min-height: 64px; display: grid; gap: 2px; }
.result .code { font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: .04em; }
.result.ok .code { color: var(--ok); } .result.ng .code { color: var(--ng); }
.result .note { color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats div { background: var(--bg); border-radius: 8px; padding: 8px 4px; }
.stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 320px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; font-size: 13px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.log .c { font-family: var(--mono); font-weight: 700; }
.log .ng { color: var(--ng); }
.log .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.small { font-size: 12px; color: var(--muted); }
.tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
input[type=range] { width: 160px; }
details summary { cursor: pointer; font-weight: 700; }
textarea { width: 100%; min-height: 120px; font: 12px var(--mono); border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 8px; }
@media (prefers-reduced-motion: reduce) { .guide { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>ラベル読み取り試験</h1>
    <p class="sub">asiac のラベルのバーコードを、このスマホで読めるか・何秒かかるかを試します。STORES にはつながりません（読むだけ）。</p>
  </header>

  <section class="panel">
    <label class="row">場所
      <select id="area">
        <option>1階</option><option>1階（カフェ）</option><option>2階</option><option>倉庫</option>
        <option>ギャラリー</option><option>外</option><option>外（多肉）</option>
      </select>
    </label>
    <label class="row">読み方
      <select id="mode">
        <option value="single">1枚ずつ（かかった秒数を測る）</option>
        <option value="continuous">続けて読む（棚卸しと同じ）</option>
      </select>
    </label>
    <label class="row">読む仕組み
      <select id="engine">
        <option value="auto">自動</option>
        <option value="native">スマホ標準（Android の Chrome だけ）</option>
        <option value="wasm">組み込み（iPhone はこれ）</option>
      </select>
    </label>
  </section>

  <div class="cam" id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="guide" id="guide" hidden></div>
    <div class="hint" id="hint" hidden>白い枠の中にバーコードを入れてください</div>
    <div class="idle" id="idle">「カメラを始める」を押すと、ここに映ります</div>
  </div>

  <div class="btns">
    <button class="main" id="start">カメラを始める</button>
    <button class="main" id="next" disabled>次を読む</button>
  </div>
  <div class="tools" id="tools" hidden>
    <label class="row" id="zoomBox" hidden>ズーム <input type="range" id="zoom"></label>
    <button id="torch" hidden>ライト</button>
    <button id="stop">カメラを止める</button>
  </div>

  <section class="panel">
    <div class="result" id="result"><span class="note">まだ読んでいません</span></div>
    <div class="stats">
      <div><b id="sCount">0</b><span>読めた</span></div>
      <div><b id="sAvg">–</b><span>平均（秒）</span></div>
      <div><b id="sMax">–</b><span>いちばん遅い（秒）</span></div>
    </div>
    <label class="row"><button id="fail">読めなかった</button>
      <span class="small">いくらかざしても読めないラベルがあったら押す（数を数えます）</span></label>
  </section>

  <section class="panel">
    <strong>記録</strong>
    <ul class="log" id="log"><li class="small">読んだラベルがここに並びます</li></ul>
  </section>

  <section class="panel">
    <strong>結果を送る</strong>
    <p class="small">試し終わったら「結果をコピー」を押して、Claude に貼り付けてください。</p>
    <button class="main" id="copy">結果をコピー</button>
    <textarea id="out" readonly hidden aria-label="結果"></textarea>
  </section>

  <section class="panel">
    <details>
      <summary>写真から読む（カメラで読めないとき）</summary>
      <p class="small">カメラアプリで撮ったラベルの写真を選ぶと、そこから読みます。</p>
      <input type="file" id="photo" accept="image/*" capture="environment">
    </details>
    <p class="small" id="env"></p>
  </section>
</main>

<script type="module">
const $ = id => document.getElementById(id);
let stream = null, track = null, detector = null, engineName = "", running = false, busy = false;
let waitingSince = null;           // 1枚ずつ: 「次を読む」を押した時刻
let lastCode = "", lastAt = 0;      // 続けて読む: 同じラベルを何度も数えない
let fails = 0, frames = 0, framesStart = 0;
const reads = [];                   // {at, area, raw, code, ok, sec, engine}
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

// ---- asiac のラベルか確かめる（200＋日付6桁＋連番3桁＋チェック数字）----
function check(raw) {
  if (!/^\d{13}$/.test(raw)) return { ok: false, why: "13桁の数字ではない" };
  let s = 0;
  for (let i = 0; i < 12; i++) s += +raw[i] * (i % 2 ? 3 : 1);
  if ((10 - s % 10) % 10 !== +raw[12]) return { ok: false, why: "チェック数字が合わない（読み間違い）" };
  if (!raw.startsWith("200")) return { ok: false, why: "asiac のラベルではない（メーカーの JAN など）" };
  const code = "A" + raw.slice(3, 12);
  const y = 2000 + +code.slice(1, 3), m = +code.slice(3, 5), d = +code.slice(5, 7);
  const dt = new Date(y, m - 1, d);
  if (dt.getMonth() !== m - 1 || dt.getDate() !== d) return { ok: false, why: "日付の部分がおかしい" };
  return { ok: true, code };
}

// ---- 読む仕組み ----
async function makeDetector(choice) {
  const hasNative = "BarcodeDetector" in window &&
    (await window.BarcodeDetector.getSupportedFormats?.().catch(() => []) || []).includes("ean_13");
  if (choice === "native" || (choice === "auto" && hasNative)) {
    if (!hasNative) throw new Error("このスマホ・ブラウザには標準の読み取り機能がありません。「組み込み」か「自動」を選んでください。");
    engineName = "スマホ標準";
    return new window.BarcodeDetector({ formats: ["ean_13"] });
  }
  setResult("note", "読み取りの部品を読み込み中…（初回だけ数秒）");
  const mod = await import("https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/ponyfill/+esm");
  engineName = "組み込み（ZXing）";
  const det = new mod.BarcodeDetector({ formats: ["ean_13"] });
  // 部品の準備を先に済ませる（最初の1枚が遅くならないように）
  await det.detect(new ImageData(8, 8)).catch(() => {});
  return det;
}

// ---- カメラ ----
async function start() {
  $("start").disabled = true;
  try {
    detector = await makeDetector($("engine").value);
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
  } catch (e) {
    $("start").disabled = false;
    const msg = e && e.name === "NotAllowedError"
      ? "カメラが許可されていません。ブラウザの設定でこのページのカメラを許可してください。"
      : (e.message || String(e));
    return setResult("ng-note", msg);
  }
  track = stream.getVideoTracks()[0];
  $("video").srcObject = stream;
  await $("video").play().catch(() => {});
  $("idle").hidden = true; $("guide").hidden = false; $("hint").hidden = false; $("tools").hidden = false;
  $("start").textContent = "カメラ動作中"; $("next").disabled = false;
  setupTools();
  keepAwake();
  beep(0); // 音を鳴らせるようにする（iPhone は押した直後でないと音が出ない）
  running = true; frames = 0; framesStart = performance.now();
  if ($("mode").value === "single") armSingle(); else { waitingSince = performance.now(); setResult("note", "ラベルを次々にかざしてください"); }
  loop();
  showEnv();
}

function stop() {
  running = false;
  stream?.getTracks().forEach(t => t.stop());
  stream = null; track = null;
  $("idle").hidden = false; $("guide").hidden = true; $("hint").hidden = true; $("tools").hidden = true;
  $("start").disabled = false; $("start").textContent = "カメラを始める"; $("next").disabled = true;
}

function setupTools() {
  const caps = track.getCapabilities?.() || {};
  if (caps.zoom) {
    const z = $("zoom");
    z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1;
    z.value = track.getSettings().zoom || caps.zoom.min;
    z.oninput = () => track.applyConstraints({ advanced: [{ zoom: +z.value }] }).catch(() => {});
    $("zoomBox").hidden = false;
  }
  if (caps.torch) {
    let on = false;
    $("torch").hidden = false;
    $("torch").onclick = () => { on = !on; track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {}); $("torch").textContent = on ? "ライトを消す" : "ライト"; };
  }
}

async function keepAwake() { try { await navigator.wakeLock?.request("screen"); } catch {} }

function armSingle() {
  waitingSince = performance.now();
  lastCode = "";
  setResult("note", "ラベルをかざしてください（時間を測っています）");
}

// ---- 毎コマ、白い枠の中だけを読む ----
async function loop() {
  if (!running) return;
  const v = $("video");
  if (!busy && v.readyState >= 2 && waitingSince !== null) {
    busy = true;
    try {
      // 画面の枠（横80%・縦40%）に当たる所を、元の映像から切り出す
      const vw = v.videoWidth, vh = v.videoHeight;
      const box = $("cam").getBoundingClientRect();
      const scale = Math.max(box.width / vw, box.height / vh);
      const shownW = box.width / scale, shownH = box.height / scale;
      const ox = (vw - shownW) / 2, oy = (vh - shownH) / 2;
      const sx = ox + shownW * 0.10, sy = oy + shownH * 0.30, sw = shownW * 0.80, sh = shownH * 0.40;
      canvas.width = Math.round(sw); canvas.height = Math.round(sh);
      ctx.drawImage(v, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      const found = await detector.detect(canvas);
      frames++;
      if (found.length) onRead(found[0].rawValue);
    } catch (e) { /* 1コマ失敗しても続ける */ }
    busy = false;
  }
  requestAnimationFrame(loop);
}

function onRead(raw) {
  const now = performance.now();
  if (raw === lastCode && now - lastAt < 2000) { lastAt = now; return; } // 同じラベルにかざしたまま
  lastCode = raw; lastAt = now;
  const sec = waitingSince !== null ? (now - waitingSince) / 1000 : null;
  const c = check(raw);
  const r = { at: new Date(), area: $("area").value, raw, code: c.ok ? c.code : null, ok: c.ok, why: c.why, sec, engine: engineName };
  reads.push(r);
  flash();
  beep(c.ok ? 1 : 2);
  navigator.vibrate?.(c.ok ? 60 : [60, 60, 60]);
  if (c.ok) setResult("ok", c.code, `${raw}　${sec !== null ? sec.toFixed(1) + " 秒" : ""}`);
  else setResult("ng", raw, c.why);
  if ($("mode").value === "single") { waitingSince = null; $("next").focus(); }
  else waitingSince = now; // 続けて読む: 前のラベルからの間隔
  render();
}

// ---- 表示 ----
function setResult(kind, main, note) {
  const el = $("result");
  el.className = "result" + (kind === "ok" ? " ok" : kind === "ng" ? " ng" : "");
  if (kind === "note" || kind === "ng-note") {
    el.innerHTML = "";
    const s = document.createElement("span"); s.className = "note"; s.textContent = main;
    if (kind === "ng-note") s.style.color = "var(--ng)";
    el.append(s); return;
  }
  el.innerHTML = "";
  const c = document.createElement("span"); c.className = "code"; c.textContent = main;
  const n = document.createElement("span"); n.className = "note"; n.textContent = note || "";
  el.append(c, n);
}

function flash() { const g = $("guide"); g.classList.add("hit"); setTimeout(() => g.classList.remove("hit"), 400); }

function render() {
  const ok = reads.filter(r => r.ok);
  const secs = reads.filter(r => r.sec !== null).map(r => r.sec);
  $("sCount").textContent = ok.length;
  $("sAvg").textContent = secs.length ? (secs.reduce((a, b) => a + b, 0) / secs.length).toFixed(1) : "–";
  $("sMax").textContent = secs.length ? Math.max(...secs).toFixed(1) : "–";
  const log = $("log"); log.innerHTML = "";
  reads.slice().reverse().forEach(r => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.className = "t"; a.textContent = r.at.toTimeString().slice(0, 8);
    const b = document.createElement("span"); b.className = "c" + (r.ok ? "" : " ng"); b.textContent = r.ok ? `${r.code}（${r.area}）` : `${r.raw} ${r.why}`;
    const c = document.createElement("span"); c.className = "t"; c.textContent = r.sec !== null ? r.sec.toFixed(1) + "秒" : "";
    li.append(a, b, c); log.append(li);
  });
  if (!reads.length) log.innerHTML = '<li class="small">読んだラベルがここに並びます</li>';
}

let audio = null;
function beep(kind) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (kind === 0) { audio.resume(); return; }
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = kind === 1 ? 1760 : 330;
    g.gain.value = 0.15; o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + (kind === 1 ? 0.09 : 0.3));
  } catch {}
}

function showEnv() {
  const s = track?.getSettings?.() || {};
  $("env").textContent = `読む仕組み: ${engineName}　映像: ${s.width || "?"}×${s.height || "?"}　ブラウザ: ${navigator.userAgent}`;
}

function report() {
  const ok = reads.filter(r => r.ok), secs = reads.filter(r => r.sec !== null).map(r => r.sec);
  const byArea = {};
  ok.forEach(r => { byArea[r.area] = (byArea[r.area] || 0) + 1; });
  const fps = frames && framesStart ? (frames / ((performance.now() - framesStart) / 1000)).toFixed(1) : "?";
  const s = track?.getSettings?.() || {};
  return [
    "【asiac ラベル読み取り試験】",
    `日時: ${new Date().toLocaleString("ja-JP")}`,
    `ブラウザ: ${navigator.userAgent}`,
    `読む仕組み: ${engineName || "未開始"}　映像: ${s.width || "?"}×${s.height || "?"}　1秒に調べた回数: ${fps}`,
    `読み方: ${$("mode").selectedOptions[0].text}`,
    `読めた: ${ok.length} 件　asiac 以外・読み間違い: ${reads.length - ok.length} 件　読めなかった（ボタン）: ${fails} 件`,
    `秒数: 平均 ${secs.length ? (secs.reduce((a, b) => a + b, 0) / secs.length).toFixed(1) : "-"}　最長 ${secs.length ? Math.max(...secs).toFixed(1) : "-"}`,
    `場所ごと: ${Object.entries(byArea).map(([k, v]) => `${k} ${v}`).join("、") || "-"}`,
    "",
    ...reads.map(r => `${r.at.toTimeString().slice(0, 8)}\t${r.area}\t${r.ok ? r.code : r.raw + "（" + r.why + "）"}\t${r.sec !== null ? r.sec.toFixed(1) + "秒" : ""}`),
  ].join("\n");
}

// ---- 写真から読む ----
$("photo").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    detector = detector || await makeDetector($("engine").value);
    const img = await createImageBitmap(f);
    const t0 = performance.now();
    const found = await detector.detect(img);
    const sec = (performance.now() - t0) / 1000;
    if (!found.length) { fails++; return setResult("ng-note", "この写真からは読めませんでした。ラベルが大きく・はっきり写るように撮り直してください。"); }
    waitingSince = null; lastCode = "";
    const c = check(found[0].rawValue);
    reads.push({ at: new Date(), area: $("area").value + "・写真", raw: found[0].rawValue, code: c.ok ? c.code : null, ok: c.ok, why: c.why, sec: null, engine: engineName }); // 写真の秒数はかざす速さと違うので平均に入れない
    c.ok ? setResult("ok", c.code, `写真から ${sec.toFixed(1)} 秒`) : setResult("ng", found[0].rawValue, c.why);
    render(); showEnv();
  } catch (err) { setResult("ng-note", err.message || String(err)); }
  e.target.value = "";
};

$("start").onclick = start;
$("stop").onclick = stop;
$("next").onclick = () => { if ($("mode").value === "single") armSingle(); };
$("mode").onchange = () => { if (running) { $("mode").value === "single" ? armSingle() : (waitingSince = performance.now(), setResult("note", "ラベルを次々にかざしてください")); } };
$("engine").onchange = () => { if (running) { stop(); setResult("note", "読む仕組みを変えました。もう一度「カメラを始める」を押してください。"); } detector = null; };
$("fail").onclick = () => { fails++; setResult("ng-note", `読めなかったラベル: ${fails} 件`); if ($("mode").value === "single" && running) armSingle(); };
$("copy").onclick = async () => {
  const text = report();
  const out = $("out"); out.value = text; out.hidden = false;
  try { await navigator.clipboard.writeText(text); $("copy").textContent = "コピーしました"; }
  catch { out.select(); $("copy").textContent = "下の文字を長押しでコピーしてください"; }
  setTimeout(() => { $("copy").textContent = "結果をコピー"; }, 3000);
};
if (!navigator.mediaDevices?.getUserMedia) setResult("ng-note", "このブラウザではカメラが使えません。iPhone は Safari、Android は Chrome で開いてください。");
</script>
</body>
</html>
